# isu_condition 正本用 Valkey。IP は書かずホスト名で listen する。
daemonize no
pidfile /run/valkey/valkey.pid
port 6379
bind 127.0.0.1 isucondition-1.t.isucon.dev
protected-mode yes
timeout 0
tcp-keepalive 300

dir /var/lib/valkey
dbfilename dump.rdb
save ""
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

maxmemory-policy noeviction

loglevel notice
logfile ""
databases 1
