# isu_condition 正本用 Valkey。install 時に isucon1 の私有 IP を bind に足す。
daemonize no
pidfile /run/valkey/valkey.pid
port 6379
bind 127.0.0.1 192.168.0.11
protected-mode no
timeout 0
tcp-keepalive 300

dir /var/lib/valkey
dbfilename dump.rdb
save ""
# ベンチは /initialize で MariaDB から載せ直すため永続化しない。
appendonly no

maxmemory-policy noeviction

loglevel notice
logfile ""
databases 1
