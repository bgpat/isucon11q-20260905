# isu_condition 正本用 Valkey。VPC 内のため全インターフェースで待ち受ける。
# 同一ホストの Go は unixsocket。TCP 6379 は停止と ping 向けに残す。
daemonize no
pidfile /run/valkey/valkey.pid
port 6379
bind 0.0.0.0
unixsocket /run/valkey/valkey.sock
unixsocketperm 777
protected-mode no
timeout 0
tcp-keepalive 300

dir /var/lib/valkey
dbfilename dump.rdb
# 負荷中はスナップショットしない。停止時は unit の `shutdown save` で RDB を書く。
save ""
appendonly no

maxmemory-policy noeviction

loglevel notice
logfile ""
databases 1
