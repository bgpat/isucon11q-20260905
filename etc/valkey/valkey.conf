# isu_condition 正本用 Valkey。install 時に isucon1 の私有 IP を bind に足す。
# isucon1 の Go は unixsocket。TCP 6379 は isucon2/3 向けに残す。
daemonize no
pidfile /run/valkey/valkey.pid
port 6379
bind 127.0.0.1 192.168.0.11
unixsocket /run/valkey/valkey.sock
unixsocketperm 770
protected-mode no
timeout 0
tcp-keepalive 300

dir /var/lib/valkey
dbfilename dump.rdb
# 負荷中はスナップショットしない。停止時は unit の `shutdown save` で RDB を書く。
save ""
appendonly no

maxmemory-policy noeviction

loglevel notice
logfile ""
databases 1
