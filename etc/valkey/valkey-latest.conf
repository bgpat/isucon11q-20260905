# cond:latest:* 専用 Valkey。ZADD 用の 6379 とはプロセスを分ける。
daemonize no
pidfile /run/valkey-latest/valkey.pid
port 6380
bind 0.0.0.0
protected-mode no
timeout 0
tcp-keepalive 300

dir /var/lib/valkey-latest
dbfilename dump.rdb
save ""
appendonly no

maxmemory-policy noeviction

loglevel notice
logfile ""
databases 1
