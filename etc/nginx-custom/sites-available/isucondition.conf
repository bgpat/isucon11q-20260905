upstream isucondition {
    server unix:/run/isucondition/isucondition.sock;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/certificates/tls-cert.pem;
    ssl_certificate_key /etc/nginx/certificates/tls-key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /home/isucon/webapp/public;

    location /_isucondition_icon_cache/ {
        internal;
        alias /home/isucon/webapp/public/.isucondition-icon-cache/;
        etag on;
        add_header Cache-Control "private, max-age=60, must-revalidate" always;
    }

    location ^~ /assets/ {
        alias /home/isucon/webapp/public/assets/;
        etag on;
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
    }

    location = / {
        try_files /index.html =404;
        etag on;
    }

    location = /register {
        try_files /index.html =404;
        etag on;
    }

    location ^~ /isu/ {
        try_files /index.html =404;
        etag on;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_pass http://isucondition;
    }
}
