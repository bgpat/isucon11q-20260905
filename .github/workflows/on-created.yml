name: On Created

# リポジトリ作成時に共通タスクとラベルを自動作成する。
on:
  push:
    branches:
      - master

concurrency:
  group: on-created-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  on-created:
    runs-on: ubuntu-latest
    if: ${{ github.repository != 'dbgofy/isucon-boilerplate' }}
    steps:
      - uses: actions/checkout@v4
      - name: create issue labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "phase:day-before" --color "1D76DB" --description "前日準備" --force
          gh label create "phase:just-before" --color "5319E7" --description "競技直前" --force
          gh label create "phase:start" --color "6F42C1" --description "競技開始直後" --force
          gh label create "phase:early-competition" --color "E99695" --description "競技序盤" --force
          gh label create "phase:mid-competition" --color "B60205" --description "競技中盤" --force
          gh label create "phase:final-check" --color "FBCA04" --description "競技終盤" --force
          gh label create "phase:after-competition" --color "0E8A16" --description "競技終了後" --force
          gh label create "type:task" --color "C5DEF5" --description "定型作業・確認" --force
          gh label create "type:documentation" --color "0075CA" --description "ドキュメント・記録" --force
          gh label create "type:infrastructure" --color "D4C5F9" --description "OS・ネットワーク・インフラ" --force
          gh label create "type:backup" --color "BFDADC" --description "バックアップ・復旧" --force
          gh label create "type:performance" --color "E99695" --description "性能・ベンチマーク" --force
          gh label create "type:experiment" --color "F9D0C4" --description "仮説検証・比較実験" --force
          gh label create "type:observability" --color "C2E0C6" --description "ログ・監視・計装" --force
          gh label create "type:deployment" --color "A2EEEF" --description "デプロイ・同期・起動停止" --force
          gh label create "type:validation" --color "FEF2C0" --description "検証・再起動試験" --force
          gh label create "type:application" --color "B60205" --description "アプリケーションコード" --force
          gh label create "type:database" --color "5319E7" --description "DB・SQL・インデックス" --force
          gh label create "type:security" --color "D93F0B" --description "SSH・権限・秘密情報" --force
          gh label create "type:bug" --color "D73A4A" --description "動作不良・設定不具合" --force
          gh label create "needs-user-action" --color "FBCA04" --description "ユーザーの選択・情報・操作が必要" --force

      - name: create task parent issue
        id: task-parent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t parent_urls < <(gh issue list --state all --limit 100 \
            --json title,url \
            --jq '.[] | select(.title == "ISUCON 共通タスク") | .url')
          if [ "${#parent_urls[@]}" -gt 1 ]; then
            echo "Duplicate task parent issues found: ${parent_urls[*]}" >&2
            exit 1
          fi
          if [ "${#parent_urls[@]}" -eq 1 ]; then
            parent_url="${parent_urls[0]}"
          else
            parent_url=$(gh issue create \
              --title "ISUCON 共通タスク" \
              --label "type:task" \
              --body "本 Issue は、リポジトリ作成時に登録する ISUCON 共通タスクの親 Issue です。")
            mapfile -t parent_urls < <(gh issue list --state all --limit 100 \
              --json title,url \
              --jq '.[] | select(.title == "ISUCON 共通タスク") | .url')
            if [ "${#parent_urls[@]}" -ne 1 ]; then
              echo "Task parent uniqueness check failed: ${parent_urls[*]}" >&2
              exit 1
            fi
          fi
          echo "number=${parent_url##*/}" >> "$GITHUB_OUTPUT"

      - name: create issues from task templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_NUMBER: ${{ steps.task-parent.outputs.number }}
        run: |
          issue_map=$(mktemp)

          for task in tasks/*.md; do
            if [ "$(basename "$task")" = "README.md" ]; then
              continue
            fi

            title=$(awk -F '"' '/^title:/ { print $2; exit }' "$task")
            filename=$(basename "$task")
            labels=()
            while IFS= read -r label; do
              labels+=(--label "$label")
            done < <(awk 'BEGIN { in_labels = 0 } /^labels:/ { in_labels = 1; next } in_labels && /^  - / { sub(/^  - /, ""); print; next } in_labels { exit }' "$task")
            if awk '/^needs-user-action: true$/ { found = 1 } END { exit !found }' "$task"; then
              labels+=(--label "needs-user-action")
            fi
            body=$(awk 'BEGIN { section = 0 } /^---$/ { section++; next } section >= 2 { print }' "$task")
            if awk '/^needs-user-action: true$/ { found = 1 } END { exit !found }' "$task"; then
              body=$'## ユーザー確認\n\n次のどれで進めますか？\n\n1. 実行する（必要情報を提供する）\n2. 今回は実行しない（未完了のまま保留する）\n3. 手順だけ作成する（実機・外部サービスには触れない）\n\n必要な情報:\n- サーバー名・役割・接続先:\n- 実行対象と範囲:\n- 実行してよい時間帯:\n\n質問への回答があるまで、実機・外部サービスへの操作は行わない。\n\n'$'\n'"$body"
            fi
            body="$body"$'\n\n<!-- task-template: '"$filename"$' -->'

            mapfile -t task_numbers < <(gh issue list --state all --limit 100 --json number,body \
              --jq ".[] | select(.body | contains(\"<!-- task-template: $filename -->\")) | .number")
            if [ "${#task_numbers[@]}" -gt 1 ]; then
              echo "Duplicate task issues found for $filename: ${task_numbers[*]}" >&2
              exit 1
            fi
            if [ "${#task_numbers[@]}" -eq 1 ]; then
              issue_number="${task_numbers[0]}"
            else
              issue_url=$(gh issue create --title "$title" "${labels[@]}" --parent "$PARENT_NUMBER" --body "$body")
              issue_number=${issue_url##*/}
              for _ in 1 2 3 4 5; do
                mapfile -t task_numbers < <(gh issue list --state all --limit 100 --json number,body \
                  --jq ".[] | select(.body | contains(\"<!-- task-template: $filename -->\")) | .number")
                [ "${#task_numbers[@]}" -eq 1 ] && break
                sleep 2
              done
              if [ "${#task_numbers[@]}" -ne 1 ]; then
                echo "Task uniqueness check failed for $filename: ${task_numbers[*]}" >&2
                exit 1
              fi
            fi

            printf '%s\t%s\n' "$filename" "$issue_number" >> "$issue_map"
          done

          while IFS=$'\t' read -r filename issue_number; do
            task="tasks/$filename"
            while IFS= read -r dependency; do
              dependency_number=$(awk -F '\t' -v key="$dependency" '$1 == key { print $2 }' "$issue_map")
              if [ -z "$dependency_number" ]; then
                echo "Unknown dependency $dependency in $filename" >&2
                exit 1
              fi
              dependency_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${dependency_number}" --jq .id)
              if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/dependencies/blocked_by" \
                --jq '.[].number' | grep -qx "$dependency_number"; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/dependencies/blocked_by" \
                  -F issue_id="$dependency_id" --silent
              fi
            done < <(awk '/^depends_on:/ { in_dep=1; next } in_dep && /^  - / { sub(/^  - /, ""); print; next } in_dep { in_dep=0 }' "$task")
          done < "$issue_map"
