apiVersion: 1
datasources:
- name: Prometheus
  uid: prometheus
  type: prometheus
  access: proxy
  url: http://127.0.0.1:9090
  isDefault: true
- name: Tempo
  uid: tempo
  type: tempo
  access: proxy
  url: http://127.0.0.1:3200
  jsonData:
    tracesToLogsV2:
      datasourceUid: loki
      spanStartTimeShift: '-1m'
      spanEndTimeShift: '1m'
      filterByTraceID: false
      customQuery: false
    serviceMap:
      datasourceUid: prometheus
    nodeGraph:
      enabled: true
    search:
      hide: false
- name: Loki
  uid: loki
  type: loki
  access: proxy
  url: http://127.0.0.1:3100
