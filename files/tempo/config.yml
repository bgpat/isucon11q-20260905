# Grafana Tempo（単一バイナリ）。make monitoring から nohup で起動する。
# systemd では管理しない。データは /tmp/tempo に置き、再起動で消える。
stream_over_http_enabled: true

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318
        grpc:
          endpoint: 127.0.0.1:4317

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

usage_report:
  reporting_enabled: false
